<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Applies the saved theme before first paint (external file: the CSP forbids inline scripts). -->
    <script src="/theme-boot.js"></script>
    <!--
      Content-Security-Policy (XSS hardening — mitigates localStorage-JWT theft).
      script-src 'self' blocks injected inline/eval scripts (the main XSS token-exfil
      vector); connect-src pins where the app may talk. Its API/Socket.IO origins are
      NOT hardcoded here: the placeholder token in the content below is replaced at
      build by the csp-connect-src plugin in vite.config.ts from VITE_API_URL (falling
      back to VITE_API_PROXY_TARGET) — the same env api.ts/socket.ts use, so the
      allowed origin cannot drift from the one the app calls. (This comment must not
      repeat the token: the plugin replaces every occurrence.) style-src needs
      'unsafe-inline' for Radix/Recharts
      inline style attributes. frame-ancestors is header-only (ignored in <meta>) —
      set it + HSTS via an HTTP header (vercel.json) when moving to header-based CSP.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' __API_CONNECT_SRC__"
    />
    <link rel="icon" type="image/svg+xml" href="/ck-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
